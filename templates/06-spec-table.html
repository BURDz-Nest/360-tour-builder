<!-- DATA TABLE (e.g. load limits, specs, schedule)
     Add/remove rows (<tr>) as needed. First row is the header. -->
<table style="width:100%; border-collapse:collapse; font-size:.92rem;">
  <thead>
    <tr style="background:#0053e2; color:#fff; text-align:left;">
      <th style="padding:.5rem .7rem;">[[ Column A ]]</th>
      <th style="padding:.5rem .7rem;">[[ Column B ]]</th>
    </tr>
  </thead>
  <tbody>
    <tr style="border-bottom:1px solid #e0e0e0;">
      <td style="padding:.5rem .7rem;">[[ row 1 A ]]</td>
      <td style="padding:.5rem .7rem;">[[ row 1 B ]]</td>
    </tr>
    <tr style="border-bottom:1px solid #e0e0e0; background:#f5f7fa;">
      <td style="padding:.5rem .7rem;">[[ row 2 A ]]</td>
      <td style="padding:.5rem .7rem;">[[ row 2 B ]]</td>
    </tr>
  </tbody>
</table>
