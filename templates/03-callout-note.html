<!-- CALLOUT BOXES — pick ONE of the three below and delete the rest.
     The word "Note/Important/Good" carries the meaning, so this still
     reads correctly for color-blind users (don't rely on color alone). -->

<!-- INFO (blue) -->
<div style="border-left:4px solid #0053e2; background:#eaf0fc; color:#1a1a1a;
            padding:.7rem .9rem; border-radius:6px; line-height:1.5;">
  <strong style="color:#0053e2;">Note:</strong> [[ helpful context here ]]
</div>

<!-- IMPORTANT (spark / warning) -->
<div style="border-left:4px solid #ffc220; background:#fff4d6; color:#1a1a1a;
            padding:.7rem .9rem; border-radius:6px; line-height:1.5;">
  <strong style="color:#995213;">Important:</strong> [[ the thing to watch out for ]]
</div>

<!-- GOOD / SUCCESS (green) -->
<div style="border-left:4px solid #2a8703; background:#e7f4e1; color:#1a1a1a;
            padding:.7rem .9rem; border-radius:6px; line-height:1.5;">
  <strong style="color:#2a8703;">Good:</strong> [[ what "done right" looks like ]]
</div>
