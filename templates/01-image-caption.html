<!-- IMAGE + CAPTION
     Put your photo in the tour's images/ folder, then set src below.
     Replace the alt text and caption. -->
<figure style="margin:0;">
  <img src="images/[[ your-photo.jpg ]]"
       alt="[[ describe the photo for screen readers ]]"
       style="width:100%; height:auto; border-radius:8px; display:block;" />
  <figcaption style="margin-top:.5rem; font-size:.9rem; color:#4a4a4a;">
    [[ Caption text goes here. ]]
  </figcaption>
</figure>
